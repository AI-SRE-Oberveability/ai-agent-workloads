name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish approved main source to the private POC GHCR package
        type: boolean
        required: true
        default: false
      source_sha:
        description: Exact CI-passing merged main source commit; no branch/tag
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install hash-locked development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt
      - run: ruff check src tests scripts publication_tests
      - run: ruff format --check src tests scripts publication_tests
      - name: HTTP, contracts, telemetry and capture-policy tests
        run: python -m pytest -q
      - name: Build the synthetic workload image
        run: docker build --tag synthetic-policy:ci .
      - name: Validate gated application chart with private render-only fixtures
        env:
          CHART_INPUT_CACHE: ${{ runner.temp }}/chart-inputs
        run: python scripts/check_application_chart.py --restore --output "$RUNNER_TEMP/application-chart-check.json"
      - name: Test manual-publication and no-value Secret-delivery guards
        run: python -m unittest discover -s publication_tests -v
  publish-private-image:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish_image == true &&
      github.repository == 'AI-SRE-Oberveability/ai-agent-workloads' &&
      github.actor == 'javedkumail' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/image-secret-delivery') &&
      vars.POC_IMAGE_PUBLICATION_ENABLED == 'true' &&
      github.sha == vars.POC_IMAGE_WORKFLOW_SHA &&
      inputs.source_sha == vars.POC_IMAGE_SOURCE_SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: private-poc-workload-image-publication
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      POC_IMAGE_PUBLICATION_ENABLED: ${{ vars.POC_IMAGE_PUBLICATION_ENABLED }}
      POC_IMAGE_WORKFLOW_SHA: ${{ vars.POC_IMAGE_WORKFLOW_SHA }}
      POC_IMAGE_SOURCE_SHA: ${{ vars.POC_IMAGE_SOURCE_SHA }}
      REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Refuse non-allowlisted dispatch before registry operations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publication.py preflight
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: image-source
          persist-credentials: false
      - name: Publish, pull the real digest and replay synthetic Secret rotation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publication.py publish --source image-source --output "$RUNNER_TEMP/workload-publication.json"
      - name: Upload only the sanitized publication receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workload-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workload-publication.json
          if-no-files-found: error
          retention-days: 7
