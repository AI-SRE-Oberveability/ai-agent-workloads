name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install hash-locked development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt
      - run: ruff check src tests
      - run: ruff format --check src tests
      - name: HTTP, contracts, telemetry and capture-policy tests
        run: python -m pytest -q
      - name: Build the synthetic workload image
        run: docker build --tag synthetic-policy:ci .
